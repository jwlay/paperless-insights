server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Regenerated at container startup from PAPERLESS_URL — never cache it.
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}

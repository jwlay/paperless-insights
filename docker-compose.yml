services:
  paperless-insights:
    image: ghcr.io/jwlay/paperless-insights:latest
    # For local development instead of the published image:
    # build: .
    restart: unless-stopped
    environment:
      # Optional: pre-fills the Paperless URL field on first connect.
      # Never put the API token here — see README.md for why.
      PAPERLESS_URL: ${PAPERLESS_URL:-}
    ports:
      - "8080:80"

